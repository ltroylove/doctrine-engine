name: Enforce PR source branch

on:
  pull_request:
    branches: [main]

jobs:
  enforce-pr-source:
    runs-on: ubuntu-latest
    steps:
      - name: Only development may merge into main
        run: |
          if [ "${{ github.head_ref }}" != "development" ]; then
            echo "::error::PRs into main must come from development (got: ${{ github.head_ref }})"
            exit 1
          fi
